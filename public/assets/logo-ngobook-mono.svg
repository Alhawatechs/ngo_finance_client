<?xml version="1.0" encoding="UTF-8"?>
<!--
  NGOBook  MONOCHROME LOCKUP
  ---------------------------
  Single-ink version for : newsprint, fax, engraving,
                           embroidery, dark-theme UIs.
  Change "currentColor" via CSS / attribute to re-tint everything,
    e.g.  <svg style="color:#222">   or   <svg color="#fff">
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1400 560"
     width="1400" height="560"
     color="#222222"
     role="img"
     aria-label="NGOBook Finance">

  <g fill="currentColor">
    <!-- Gray block represented with 35 % opacity -->
    <rect x="70"  y="170" width="58"  height="280" opacity="0.35"/>
    <!-- Charcoal block at 70 % opacity -->
    <rect x="232" y="152" width="152" height="338" opacity="0.70"/>
    <!-- Primary block at full opacity (was teal) -->
    <rect x="148" y="98"  width="190" height="352"/>

    <!-- Three dots -->
    <circle cx="362" cy="132" r="11"/>
    <circle cx="394" cy="132" r="11"/>
    <circle cx="426" cy="132" r="11"/>

    <!-- Wordmark -->
    <text x="168" y="430"
          font-family='"Gotham Rounded","Avenir Next Rounded","Plus Jakarta Sans","Circular","Nunito","Inter","Helvetica Neue",Arial,sans-serif'
          font-weight="900"
          font-size="232"
          letter-spacing="-6">ngobook</text>

    <!-- Subtag -->
    <text x="1268" y="498"
          text-anchor="end"
          font-family='"Gotham Rounded","Avenir Next Rounded","Plus Jakarta Sans","Circular","Nunito","Inter","Helvetica Neue",Arial,sans-serif'
          font-weight="500"
          font-size="58"
          letter-spacing="4">finance</text>
  </g>
</svg>
