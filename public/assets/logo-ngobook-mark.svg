<?xml version="1.0" encoding="UTF-8"?>
<!--
  NGOBook  ICON MARK  (badge only, square)
  ----------------------------------------
  Use for : favicon, app-icon, avatar, social profile,
            watermark, small UI chips.
  Safe areas built in : 60 px padding on a 600 px art-board.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 600"
     width="600" height="600"
     role="img"
     aria-labelledby="ngob-mark-title">
  <title id="ngob-mark-title">NGOBook mark</title>

  <!-- Warm gray block -->
  <rect x="90"  y="180" width="70"  height="300" fill="#B6B3AD"/>

  <!-- Charcoal block (offset right/down, behind teal) -->
  <rect x="275" y="160" width="175" height="360" fill="#222222"/>

  <!-- Teal block (dominant) -->
  <rect x="180" y="100" width="220" height="380" fill="#17A092"/>

  <!-- Three teal dots -->
  <g fill="#17A092">
    <circle cx="430" cy="140" r="13"/>
    <circle cx="468" cy="140" r="13"/>
    <circle cx="506" cy="140" r="13"/>
  </g>

  <!-- Monogram  "nb"  carved into the stack
       (same family / weight as primary wordmark) -->
  <text x="300" y="425"
        text-anchor="middle"
        font-family='"Gotham Rounded","Avenir Next Rounded","Plus Jakarta Sans","Circular","Nunito","Inter","Helvetica Neue",Arial,sans-serif'
        font-weight="900"
        font-size="240"
        letter-spacing="-8"
        fill="#FFFFFF">n<tspan fill="#222222">b</tspan></text>
</svg>
